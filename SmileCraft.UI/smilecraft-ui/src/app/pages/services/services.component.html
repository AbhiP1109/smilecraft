<section id="services" class="services-section">
  <div class="container">
    <div class="section-header">
      <span class="section-badge">OUR SERVICES</span>
      <h2>Complete Dental Care</h2>
      <p>We provide high-quality dental treatments using the latest technology and techniques.</p>
    </div>

    <div class="services-grid">
      <div class="service-card" *ngFor="let service of services; let i = index">
        <div class="card-number">0{{ i + 1 }}</div>
        <div class="service-icon">
          <svg *ngIf="service.icon === 'cleaning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C9.5 2 7.5 3.5 6.5 5.5C5.5 7.5 5 9.5 5.5 11.5C6 13.5 6.5 15.5 7.5 17.5C8 18.5 8.5 19.5 9.5 19.5C10.5 19.5 10.5 18.5 12 18.5C13.5 18.5 13.5 19.5 14.5 19.5C15.5 19.5 16 18.5 16.5 17.5C17.5 15.5 18 13.5 18.5 11.5C19 9.5 18.5 7.5 17.5 5.5C16.5 3.5 14.5 2 12 2Z"/><path d="M9 14C9 14 10.5 16 12 16C13.5 16 15 14 15 14"/></svg>
          <svg *ngIf="service.icon === 'smile'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <svg *ngIf="service.icon === 'implant'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <svg *ngIf="service.icon === 'root'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C9.5 2 7.5 3.5 6.5 5.5C5.5 7.5 5 9.5 5.5 11.5C6 13.5 6.5 15.5 7.5 17.5C8 18.5 8.5 19.5 9.5 19.5C10.5 19.5 10.5 18.5 12 18.5C13.5 18.5 13.5 19.5 14.5 19.5C15.5 19.5 16 18.5 16.5 17.5C17.5 15.5 18 13.5 18.5 11.5C19 9.5 18.5 7.5 17.5 5.5C16.5 3.5 14.5 2 12 2Z"/><path d="M12 8v8M8 12h8"/></svg>
          <svg *ngIf="service.icon === 'braces'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/><path d="M6 12v4M18 12v4"/></svg>
          <svg *ngIf="service.icon === 'whitening'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8h6.1l-4.9 3.6 1.9 5.8-5-3.6-5 3.6 1.9-5.8L4 8.8h6.1L12 3z"/></svg>
        </div>
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>
        <a href="#" class="service-link">
          Learn More
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </div>
</section>
