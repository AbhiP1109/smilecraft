<section class="why-section">
  <div class="container">
    <div class="section-header">
      <span class="section-badge">WHY CHOOSE US</span>
      <h2>Why Thousands Trust Smile Craft</h2>
      <p>We combine modern technology, experienced dentists and patient-focused care to provide the best dental experience.</p>
    </div>

    <div class="features-grid">
      <div class="feature-card" *ngFor="let feature of features; let i = index">
        <div class="feature-number">0{{ i + 1 }}</div>
        <div class="feature-icon">
          <svg *ngIf="feature.icon === 'experienced'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <svg *ngIf="feature.icon === 'equipment'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C9.5 2 7.5 3.5 6.5 5.5C5.5 7.5 5 9.5 5.5 11.5C6 13.5 6.5 15.5 7.5 17.5C8 18.5 8.5 19.5 9.5 19.5C10.5 19.5 10.5 18.5 12 18.5C13.5 18.5 13.5 19.5 14.5 19.5C15.5 19.5 16 18.5 16.5 17.5C17.5 15.5 18 13.5 18.5 11.5C19 9.5 18.5 7.5 17.5 5.5C16.5 3.5 14.5 2 12 2Z"/><path d="M9 14C9 14 10.5 16 12 16C13.5 16 15 14 15 14"/></svg>
          <svg *ngIf="feature.icon === 'patient'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <svg *ngIf="feature.icon === 'pricing'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <svg *ngIf="feature.icon === 'timing'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <svg *ngIf="feature.icon === 'emergency'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <h4>{{ feature.title }}</h4>
        <p>{{ feature.description }}</p>
      </div>
    </div>
  </div>
</section>
