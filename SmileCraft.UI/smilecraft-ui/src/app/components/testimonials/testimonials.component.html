<section id="testimonials" class="testimonials-section">
  <div class="container">
    <div class="section-header">
      <span class="section-badge">PATIENT TESTIMONIALS</span>
      <h2>Hear What Our Happy Patients Say</h2>
      <p>Nothing makes us happier than seeing our patients leave with healthy, confident smiles.</p>
    </div>

    <div class="testimonials-grid">
      <div class="testimonial-card" *ngFor="let item of testimonials">
        <div class="quote-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/></svg>
        </div>
        <p class="review">{{ item.review }}</p>
        <div class="stars">
          <svg *ngFor="let star of [1,2,3,4,5]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </div>
        <div class="patient">
          <div class="avatar">
            {{ item.name.charAt(0) }}
          </div>
          <div class="patient-info">
            <h5>{{ item.name }}</h5>
            <small>{{ item.location }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
