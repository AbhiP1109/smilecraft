<div class="doctor-card">
  <div class="avatar-wrapper">
    <div class="avatar" [style.background]="getAvatarGradient(doctor.id)">
      {{ getInitials(doctor.name) }}
    </div>
    <div class="avatar-ring"></div>
  </div>

  <h3>{{ doctor.name }}</h3>
  <span class="specialty-badge">{{ doctor.designation }}</span>

  <p class="experience">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    {{ doctor.experience }} Experience
  </p>

  <div class="rating">
    <svg *ngFor="let star of [1,2,3,4,5]" viewBox="0 0 24 24" fill="currentColor" [class.filled]="star <= doctor.rating">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>
  </div>
</div>
